version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=0
      - QUANTUM_BANK_DATABASE=/data/quantum_bank.db
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - quantum-bank-data:/data
    depends_on:
      - prometheus
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /prometheus

volumes:
  quantum-bank-data: